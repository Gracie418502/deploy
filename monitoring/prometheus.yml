global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'synapsvault-monitor'
    # Defaults to 'local' for docker-compose; production deployments set
    # PROMETHEUS_ENVIRONMENT=production (Prometheus expands ${VAR} here).
    environment: '${PROMETHEUS_ENVIRONMENT:-local}'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Mounted at this path by docker-compose.yml.
rule_files:
  - '/etc/prometheus/alert-rules.yml'
  # Synthetic alert-delivery drill rules (see monitoring/README.md). These are
  # gated on the `drill` external label so they never fire in normal operation
  # and never touch the real incident thresholds in alert-rules.yml.
  - '/etc/prometheus/drill-rules.yml'

# Job names matter: monitoring/alert-rules.yml selects on job="backend" and
# job="database".
scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'

  # The backend exposes the running release revision via the build_info gauge
  # (see backend metrics instrumentation):
  #   synapsvault_build_info{version="<git sha or tag>",environment="<env>"} 1
  # The Grafana "Deployment Version" panel reads this metric (grouped by
  # environment) to correlate incidents with releases. The environment label
  # is also attached here as a scrape-time label so the panel can show the
  # deployed version per environment even if the app omits it.
  - job_name: 'backend'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'synapsvault-backend'
          tier: 'application'
          environment: '${PROMETHEUS_ENVIRONMENT:-local}'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}'
      # Keep the release revision visible on every backend series so the
      # dashboard can join service health with the deployed version.
      - source_labels: [__meta_kubernetes_pod_label_version]
        target_label: version
        regex: '(.+)'

  - job_name: 'database'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'synapsvault-database'
          tier: 'data'

  # Blackbox probes for the public frontend URL: HTTP availability and TLS
  # certificate expiry. alert-rules.yml selects on job="blackbox_http" and
  # job="blackbox_tls".
  - job_name: 'blackbox_http'
    metrics_path: '/probe'
    params:
      module: ['http_2xx']
    static_configs:
      - targets: ['https://synapsvault.example.com']
        labels:
          service: 'synapsvault-frontend'
          tier: 'application'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  - job_name: 'blackbox_tls'
    metrics_path: '/probe'
    params:
      module: ['http_2xx']
    static_configs:
      - targets: ['https://synapsvault.example.com']
        labels:
          service: 'synapsvault-frontend'
          tier: 'application'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  # kube-state-metrics powers the pod restart / CrashLoopBackOff alerts.
  - job_name: 'kube-state-metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['kube-state-metrics:8080']
        labels:
          service: 'kube-state-metrics'
          tier: 'infrastructure'

  # Synthetic alert-delivery drill source. The drill procedure toggles the
  # `synthetic_drill_active` metric (value 1) here to exercise the full
  # Prometheus -> Alertmanager -> receiver pipeline without modifying any real
  # alert thresholds. The drill rules in drill-rules.yml additionally require
  # the `drill` external label (PROMETHEUS_DRILL=true), so this job is inert
  # during normal operation. See monitoring/README.md for the procedure.
  - job_name: 'drill'
    scrape_interval: 15s
    static_configs:
      - targets: ['drill-exporter:9101']
        labels:
          service: 'synthetic-drill'
          tier: 'monitoring'
          drill: 'true'

  # Backup metrics (soroban_backup_*) are written by scripts/backup.sh to a
  # node_exporter textfile collector. Uncomment when backups run on a host with
  # node_exporter; the GitHub Actions backup job has no exporter to scrape.
  # - job_name: 'backup'
  #   scrape_interval: 60s
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'backup'
  #         tier: 'infrastructure'
