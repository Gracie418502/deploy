rule_files:
  - ../alert-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="backend",instance="backend:8080"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackendDown
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
              job: backend
              instance: backend:8080
            exp_annotations:
              summary: Backend instance backend:8080 is down
              description: Backend target backend:8080 (job backend) has been unreachable for more than 1 minute.
              runbook_url: https://github.com/example/soroban-backend/blob/main/docs/runbooks/backend-down.md

  - interval: 1m
    input_series:
      - series: 'up{job="backend",instance="backend:8080"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackendDown
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",status="500"}'
        values: '0+60x10'
      - series: 'http_requests_total{job="backend",status="200"}'
        values: '0+540x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: HighHttp5xxErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
            exp_annotations:
              summary: High HTTP 5xx error rate (10%)
              description: More than 5% of backend HTTP requests have returned 5xx responses over the last 5 minutes.
              runbook_url: https://github.com/example/soroban-backend/blob/main/docs/runbooks/http-5xx.md

  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",status="500"}'
        values: '0+1x10'
      - series: 'http_requests_total{job="backend",status="200"}'
        values: '0+999x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: HighHttp5xxErrorRate
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'soroban_backup_last_success_timestamp_seconds'
        values: '-100000x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              team: backend
            exp_annotations:
              summary: "Backup is stale for "
              description: "The last successful backup for  was more than 26 hours ago, exceeding the expected backup interval."
              runbook_url: https://github.com/example/soroban-backend/blob/main/docs/runbooks/backup-stale.md

  - interval: 1m
    input_series:
      - series: 'soroban_backup_last_success_timestamp_seconds'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupStale
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'soroban_alert_drill_active'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: AlertDeliveryDrill
        exp_alerts:
          - exp_labels:
              severity: info
              team: backend
              drill: "true"
            exp_annotations:
              summary: Synthetic alert-delivery drill is active
              description: This is a synthetic alert generated by the controlled alert-delivery drill. No real incident is in progress; ignore unless a drill was not scheduled.
              runbook_url: https://github.com/example/soroban-backend/blob/main/docs/runbooks/alert-delivery-drill.md

  - interval: 1m
    input_series:
      - series: 'soroban_alert_drill_active'
        values: '0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: AlertDeliveryDrill
        exp_alerts: []

  # Fast burn: sustained high error ratio over the short window.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",status="500"}'
        values: '0+60x10'
      - series: 'http_requests_total{job="backend",status="200"}'
        values: '0+540x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackendErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              team: backend
              job: backend
            exp_annotations:
              summary: Backend is burning its error budget quickly
              description: Backend is consuming its error budget at a fast rate over the short window.
              runbook_url: https://github.com/example/soroban-backend/blob/main/docs/runbooks/error-budget-burn.md

  # Slow burn: sustained moderate error ratio over the long window.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",status="500"}'
        values: '0+6x70'
      - series: 'http_requests_total{job="backend",status="200"}'
        values: '0+594x70'
    alert_rule_test:
      - eval_time: 70m
        alertname: BackendErrorBudgetSlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
              team: backend
              job: backend
            exp_annotations:
              summary: Backend is burning its error budget steadily
              description: Backend is consuming its error budget at a slow but sustained rate over the long window.
              runbook_url: https://github.com/example/soroban-backend/blob/main/docs/runbooks/error-budget-burn.md

  # Normal error ratio: neither burn alert fires.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",status="500"}'
        values: '0+1x70'
      - series: 'http_requests_total{job="backend",status="200"}'
        values: '0+999x70'
    alert_rule_test:
      - eval_time: 70m
        alertname: BackendErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 70m
        alertname: BackendErrorBudgetSlowBurn
        exp_alerts: []

  # Low traffic: high error ratio but request volume below the minimum, so no alert.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",status="500"}'
        values: '0+1x70'
      - series: 'http_requests_total{job="backend",status="200"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 70m
        alertname: BackendErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 70m
        alertname: BackendErrorBudgetSlowBurn
        exp_alerts: []
