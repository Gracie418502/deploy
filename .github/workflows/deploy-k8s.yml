name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-k8s.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (validated against the cluster credentials before any change)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      dns_layout:
        description: 'DNS resolver layout to verify'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - kube-dns
          - nodelocaldns

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environment-scoped secrets/variables: KUBE_CONFIG plus the expected cluster
    # identity (KUBE_EXPECTED_CONTEXT, KUBE_EXPECTED_SERVER) for that environment.
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
      EXPECTED_KUBE_CONTEXT: ${{ vars.KUBE_EXPECTED_CONTEXT }}
      EXPECTED_KUBE_SERVER: ${{ vars.KUBE_EXPECTED_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned app refs
        id: refs
        run: |
          . ./.github/workflows/app-versions.env
          {
            echo "backend=${BACKEND_REF}"
            echo "frontend=${FRONTEND_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout backend source
        uses: actions/checkout@v4
        with:
          repository: SynapsVault/backend
          ref: ${{ steps.refs.outputs.backend }}
          path: _release/backend
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: SynapsVault/frontend
          ref: ${{ steps.refs.outputs.frontend }}
          path: _release/frontend
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve source revisions
        id: revisions
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.sha }}"
          BACKEND_SHA=$(git -C _release/backend rev-parse HEAD)
          FRONTEND_SHA=$(git -C _release/frontend rev-parse HEAD)
          # Fail before any cluster change if a revision is not a full commit SHA.
          for pair in "deploy:${DEPLOY_SHA}" "backend:${BACKEND_SHA}" "frontend:${FRONTEND_SHA}"; do
            name="${pair%%:*}"; sha="${pair#*:}"
            if ! [[ "$sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
              echo "::error::${name} revision '${sha}' is not a full commit SHA"
              exit 1
            fi
            echo "${name}: ${sha}"
          done
          {
            echo "deploy=${DEPLOY_SHA}"
            echo "backend=${BACKEND_SHA}"
            echo "frontend=${FRONTEND_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Runs before any mutation: a production selection paired with staging
      # credentials (or vice versa) fails here.
      - name: Verify cluster context and namespace for the selected environment
        id: target
        run: |
          set -euo pipefail
          case "$DEPLOY_ENV" in
            production)
              EXPECTED_NAMESPACE=synapsvault-production
              KUSTOMIZE_DIR=overlays/production
              ;;
            staging)
              EXPECTED_NAMESPACE=synapsvault-staging
              KUSTOMIZE_DIR=overlays/staging
              ;;
            *)
              echo "::error::Unknown environment '${DEPLOY_ENV}'"
              exit 1
              ;;
          esac

          if [ -z "$EXPECTED_KUBE_CONTEXT" ] || [ -z "$EXPECTED_KUBE_SERVER" ]; then
            echo "::error::Set the KUBE_EXPECTED_CONTEXT and KUBE_EXPECTED_SERVER variables on the '${DEPLOY_ENV}' environment"
            exit 1
          fi

          CURRENT_CONTEXT=$(kubectl config current-context)
          CURRENT_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          echo "Environment:     ${DEPLOY_ENV}"
          echo "Kube context:    ${CURRENT_CONTEXT} (expected ${EXPECTED_KUBE_CONTEXT})"
          echo "API server:      ${CURRENT_SERVER} (expected ${EXPECTED_KUBE_SERVER})"

          if [ "$CURRENT_CONTEXT" != "$EXPECTED_KUBE_CONTEXT" ]; then
            echo "::error::Kubeconfig context '${CURRENT_CONTEXT}' does not match the ${DEPLOY_ENV} cluster '${EXPECTED_KUBE_CONTEXT}'"
            exit 1
          fi
          if [ "${CURRENT_SERVER%/}" != "${EXPECTED_KUBE_SERVER%/}" ]; then
            echo "::error::Kubeconfig API server '${CURRENT_SERVER}' does not match the ${DEPLOY_ENV} cluster '${EXPECTED_KUBE_SERVER}'"
            exit 1
          fi

          # Every namespaced resource, and the Namespace itself, must target the
          # environment's namespace.
          RENDERED=$(kubectl kustomize "$KUSTOMIZE_DIR")
          RENDERED_NAMESPACES=$(printf '%s\n' "$RENDERED" \
            | yq -N 'select(.metadata.namespace != null) | .metadata.namespace' | sort -u)
          NAMESPACE_OBJECTS=$(printf '%s\n' "$RENDERED" \
            | yq -N 'select(.kind == "Namespace") | .metadata.name' | sort -u)
          if [ "$RENDERED_NAMESPACES" != "$EXPECTED_NAMESPACE" ] || [ "$NAMESPACE_OBJECTS" != "$EXPECTED_NAMESPACE" ]; then
            echo "::error::${KUSTOMIZE_DIR} targets namespace(s) '$(echo $RENDERED_NAMESPACES $NAMESPACE_OBJECTS)', expected only '${EXPECTED_NAMESPACE}'"
            exit 1
          fi
          echo "Namespace:       ${EXPECTED_NAMESPACE} (${KUSTOMIZE_DIR})"

          {
            echo "namespace=${EXPECTED_NAMESPACE}"
            echo "kustomize_dir=${KUSTOMIZE_DIR}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply manifests
        run: kubectl apply -k "${{ steps.target.outputs.kustomize_dir }}"

      - name: Wait for rollouts
        run: |
          kubectl -n "${{ steps.target.outputs.namespace }}" rollout status deployment/backend --timeout=300s
          kubectl -n "${{ steps.target.outputs.namespace }}" rollout status deployment/frontend --timeout=300s

      - name: Write release manifest
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
          DEPLOY_SHA: ${{ steps.revisions.outputs.deploy }}
          BACKEND_SHA: ${{ steps.revisions.outputs.backend }}
          FRONTEND_SHA: ${{ steps.revisions.outputs.frontend }}
          BACKEND_REF: ${{ steps.refs.outputs.backend }}
          FRONTEND_REF: ${{ steps.refs.outputs.frontend }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Digest of the image the live (not terminating) pods of a deployment run.
          image_digest() {
            local app="$1" container="$2" ids
            ids=$(kubectl -n "$NAMESPACE" get pods -l "app=${app}" -o json \
              | jq -r --arg c "$container" '[.items[]
                  | select(.metadata.deletionTimestamp == null)
                  | .status.containerStatuses[]?
                  | select(.name == $c)
                  | .imageID
                  | sub("^[a-z-]+://"; "")] | unique | .[]')
            if [ "$(printf '%s\n' "$ids" | grep -c 'sha256:[0-9a-f]\{64\}')" -ne 1 ]; then
              echo "::error::Expected exactly one image digest for ${app}, got: ${ids:-<none>}" >&2
              return 1
            fi
            printf '%s' "$ids"
          }

          BACKEND_IMAGE=$(image_digest backend backend)
          FRONTEND_IMAGE=$(image_digest frontend frontend)

          jq -n \
            --arg environment "$DEPLOY_ENV" \
            --arg namespace "$NAMESPACE" \
            --arg deploy_repo "${{ github.repository }}" \
            --arg deploy_sha "$DEPLOY_SHA" \
            --arg backend_ref "$BACKEND_REF" \
            --arg backend_sha "$BACKEND_SHA" \
            --arg frontend_ref "$FRONTEND_REF" \
            --arg frontend_sha "$FRONTEND_SHA" \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            --arg run_url "$RUN_URL" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              environment: $environment,
              namespace: $namespace,
              created_at: $created_at,
              workflow_run_url: $run_url,
              sources: {
                deploy:   { repository: $deploy_repo,          sha: $deploy_sha },
                backend:  { repository: "SynapsVault/backend",  ref: $backend_ref,  sha: $backend_sha },
                frontend: { repository: "SynapsVault/frontend", ref: $frontend_ref, sha: $frontend_sha }
              },
              images: {
                backend:  $backend_image,
                frontend: $frontend_image
              }
            }' > release-manifest.json

          # All three source revisions must be full commit SHAs.
          jq -e '[.sources[].sha | test("^([0-9a-f]{40}|[0-9a-f]{64})$")] | all' release-manifest.json > /dev/null \
            || { echo "::error::release-manifest.json contains a source revision that is not a full commit SHA"; exit 1; }

          cat release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ env.DEPLOY_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error

      - name: Discover DNS resolver layout
        id: dns
        run: |
          # Standard kube-dns ClusterIP (always present)
          KUBE_DNS_IP=$(kubectl -n kube-system get svc kube-dns \
            -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)
          echo "kube_dns_ip=${KUBE_DNS_IP}" >> "$GITHUB_OUTPUT"

          # NodeLocal DNS: local resolver address from the DaemonSet config
          NODELOCAL_IP=$(kubectl -n kube-system get daemonset node-local-dns \
            -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null \
            | grep -oE 'listen [0-9.]+' | awk '{print $2}' | head -n1 || true)
          if [ -z "$NODELOCAL_IP" ]; then
            # Fallback: read from kube-dns configmap (nodelocaldns convention)
            NODELOCAL_IP=$(kubectl -n kube-system get configmap kube-dns \
              -o jsonpath='{.data}' 2>/dev/null \
              | grep -oE '169\.254\.20\.10' | head -n1 || true)
          fi
          echo "nodelocal_ip=${NODELOCAL_IP}" >> "$GITHUB_OUTPUT"

          echo "kube-dns ClusterIP: ${KUBE_DNS_IP:-<none>}"
          echo "NodeLocal DNS IP:   ${NODELOCAL_IP:-<none>}"

      - name: Verify DNS (kube-dns layout)
        if: ${{ github.event.inputs.dns_layout != 'nodelocaldns' }}
        run: |
          KUBE_DNS_IP="${{ steps.dns.outputs.kube_dns_ip }}"
          if [ -z "$KUBE_DNS_IP" ]; then
            echo "kube-dns ClusterIP not found; skipping"
            exit 0
          fi
          kubectl run dns-check-kubedns --rm -i --restart=Never \
            --image=busybox:1.36 --timeout=120s \
            --overrides='{"spec":{"dnsConfig":{"nameservers":["'"$KUBE_DNS_IP"'"]}}}' \
            -- nslookup kubernetes.default.svc.cluster.local

      - name: Verify DNS (NodeLocal DNS layout)
        if: ${{ github.event.inputs.dns_layout != 'kube-dns' }}
        run: |
          NODELOCAL_IP="${{ steps.dns.outputs.nodelocal_ip }}"
          if [ -z "$NODELOCAL_IP" ]; then
            echo "NodeLocal DNS address not found; skipping"
            exit 0
          fi
          kubectl run dns-check-nodelocal --rm -i --restart=Never \
            --image=busybox:1.36 --timeout=120s \
            --overrides='{"spec":{"dnsConfig":{"nameservers":["'"$NODELOCAL_IP"'"]}}}' \
            -- nslookup kubernetes.default.svc.cluster.local

      # #159: always collect diagnostics on failure, sanitized before upload.
      - name: Collect failure diagnostics
        if: failure()
        timeout-minutes: 10
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace || 'synapsvault-production' }}
        run: bash scripts/collect-diagnostics.sh "$NAMESPACE"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ env.DEPLOY_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-diagnostics/
          if-no-files-found: warn
