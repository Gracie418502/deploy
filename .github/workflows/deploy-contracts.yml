name: Deploy Contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Stellar network to deploy to'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet
      update_configmap:
        description: 'Open a PR updating the K8s ConfigMap with the new contract IDs'
        required: false
        default: false
        type: boolean
      max_fee:
        description: 'Per-transaction fee ceiling in stroops (blank = no ceiling)'
        required: false
        default: ''
        type: string
      max_total_fee:
        description: 'Total fee ceiling across all transactions in stroops (blank = no ceiling)'
        required: false
        default: ''
        type: string
      confirm_timeout_ms:
        description: 'Overall deadline for transaction confirmation polling, in milliseconds'
        required: false
        default: '300000'
        type: string
      build_manifest:
        description: 'Optional path to a build manifest mapping WASM artifacts to expected checksums'
        required: false
        default: ''
        type: string
      plan:
        description: 'Plan only: report network, artifact hashes, signer and planned operations without signing or submitting'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy contracts
    runs-on: ubuntu-latest
    environment: contracts-${{ inputs.network }}
    outputs:
      contract_ids: ${{ steps.ids.outputs.contract_ids }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Checkout contracts
        uses: actions/checkout@v4
        with:
          repository: SynapsVault/contracts
          path: src/contracts
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contracts
        working-directory: src/contracts
        run: cargo build --release --target wasm32-unknown-unknown --workspace

      # Concurrency guard: the deploy script acquires a lockfile keyed by the
      # signer public key. Concurrent runs sharing the same Stellar signer fail
      # fast instead of racing account sequence numbers. Do not remove the lock.
      - name: Deploy contracts
        id: deploy
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
          NETWORK: ${{ inputs.network }}
          SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
          ADMIN_PUBLIC_KEY: ${{ vars.ADMIN_PUBLIC_KEY }}
          MAX_FEE: ${{ inputs.max_fee }}
          MAX_TOTAL_FEE: ${{ inputs.max_total_fee }}
          CONFIRM_TIMEOUT_MS: ${{ inputs.confirm_timeout_ms }}
        run: |
          set -euo pipefail
          # The deploy script verifies the RPC-reported network identity against
          # NETWORK before signing, aborts if a simulated fee exceeds MAX_FEE or
          # MAX_TOTAL_FEE, and bounds confirmation polling by CONFIRM_TIMEOUT_MS.
          # On timeout it prints the pending transaction hash so the run can be
          # reconciled manually; the non-zero exit fails this job.
          node scripts/deploy-contracts.cjs \
            --wasm-dir src/contracts/target/wasm32-unknown-unknown/release \
            --yes
          BUILD_MANIFEST: ${{ inputs.build_manifest }}
          PLAN_ONLY: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          args=(--wasm-dir src/contracts/target/wasm32-unknown-unknown/release)
          if [ -n "${BUILD_MANIFEST:-}" ]; then
            args+=(--manifest "$BUILD_MANIFEST")
          fi
          if [ "${PLAN_ONLY:-false}" = "true" ]; then
            # Plan mode never signs or submits transactions.
            node scripts/deploy-contracts.cjs "${args[@]}" --plan
          else
            node scripts/deploy-contracts.cjs "${args[@]}" --yes
          fi

      - name: Collect contract IDs
        id: ids
        run: |
          node - <<'JS'
          const fs = require('fs');
          const ids = Object.fromEntries(fs.readFileSync('contract-ids.env', 'utf8').split('\n')
            .filter(line => line.startsWith('STELLAR_CONTRACT_')).map(line => line.split('=')));
          fs.writeFileSync('contract-ids.json', JSON.stringify(ids));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `contract_ids=${JSON.stringify(ids)}\n`);
          JS

      - name: Upload contract IDs artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-ids-${{ inputs.network }}
          path: contract-ids.json
          if-no-files-found: warn

      - name: Upload deployment record
        if: ${{ !inputs.plan }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-${{ inputs.network }}
          path: deployment-record.json
          if-no-files-found: warn

  update-configmap:
    name: Open ConfigMap update PR
    needs: deploy
    if: ${{ inputs.update_configmap }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update ConfigMap with new contract IDs
        env:
          CONTRACT_IDS: ${{ needs.deploy.outputs.contract_ids }}
          NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          if [ -z "${CONTRACT_IDS:-}" ] || [ "$CONTRACT_IDS" = "{}" ]; then
            echo "No contract IDs produced; nothing to update."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, re

          ids = json.loads(os.environ["CONTRACT_IDS"])
          path = "k8s/configmap.yaml"
          with open(path) as f:
              text = f.read()

          for key, value in ids.items():
              # Map contract name -> ConfigMap key, e.g. "vault" -> "VAULT_CONTRACT_ID".
              cm_key = key
              pattern = re.compile(rf"^(\s*{re.escape(cm_key)}:\s*).*$", re.MULTILINE)
              if pattern.search(text):
                  text = pattern.sub(lambda m: m.group(1) + f'"{value}"', text)
              else:
                  text = text.rstrip("\n") + f'\n  {cm_key}: "{value}"\n'

          with open(path, "w") as f:
              f.write(text)
          PY

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update contract IDs in K8s ConfigMap (${{ inputs.network }})'
          title: 'chore: update contract IDs in K8s ConfigMap (${{ inputs.network }})'
          body: |
            Automated update of `k8s/configmap.yaml` with the contract IDs
            produced by the `deploy-contracts.yml` workflow run for
            `${{ inputs.network }}`.

            Contract IDs: `${{ needs.deploy.outputs.contract_ids }}`
          branch: chore/update-contract-ids-${{ inputs.network }}
          delete-branch: true
          add-paths: |
            k8s/configmap.yaml
