name: Backup

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: Operation
        type: choice
        default: both
        options: [backup, verify, both]

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

env:
  # Aligned with the Postgres major version used for local dev (docker-compose.yml)
  # and production/Supabase. Keep all three on the same major so dumps taken
  # here restore cleanly into local dev. See docs/BACKUP-RESTORE.md.
  PG_CLIENT_VERSION: '17'

jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' && inputs.job != 'verify' || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install backup clients
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_CLIENT_VERSION}" awscli gnupg
          echo "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Validate configuration
        id: config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_KEY"
          test -n "$BACKUP_STORAGE_BUCKET"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Backup dry-run (no mutations, no credential leakage)
        if: steps.config.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_METHOD: gpg
          BACKUP_AGE_RECIPIENTS_FILE: ${{ vars.BACKUP_AGE_RECIPIENTS_FILE }}
          BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_REGION: ${{ secrets.BACKUP_STORAGE_REGION || 'us-east-1' }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
          BACKUP_STORAGE_ENDPOINT: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
          BACKUP_SKIP_CONTRACTS: 1
          SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
          SOROBAN_NETWORK_PASSPHRASE: ${{ vars.SOROBAN_NETWORK_PASSPHRASE }}
          SOROBAN_CONTRACT_IDS: ${{ vars.SOROBAN_CONTRACT_IDS }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
          BACKUP_OUTPUT_DIR: backups
          GIT_COMMIT: ${{ github.sha }}
          ENVIRONMENT: production
        run: |
          set -euo pipefail
          before="$(find backups -type f 2>/dev/null | sort || true)"
          bash scripts/backup.sh --dry-run | tee dry-run.log
          after="$(find backups -type f 2>/dev/null | sort || true)"
          if [[ "${before}" != "${after}" ]]; then
            echo "::error::Dry-run mutated the output directory"
            exit 1
          fi
          for secret in "${DATABASE_URL}" "${BACKUP_ENCRYPTION_KEY}" "${BACKUP_STORAGE_ACCESS_KEY_ID}" "${BACKUP_STORAGE_SECRET_ACCESS_KEY}"; do
            if [[ -n "${secret}" ]] && grep -qF -- "${secret}" dry-run.log; then
              echo "::error::Dry-run output leaked a credential"
              exit 1
            fi
          done

      - name: Run backup script
        id: backup
        if: steps.config.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_METHOD: gpg
          BACKUP_AGE_RECIPIENTS_FILE: ${{ vars.BACKUP_AGE_RECIPIENTS_FILE }}
          BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_REGION: ${{ secrets.BACKUP_STORAGE_REGION || 'us-east-1' }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
          BACKUP_STORAGE_ENDPOINT: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
          BACKUP_SKIP_CONTRACTS: 1
          SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
          SOROBAN_NETWORK_PASSPHRASE: ${{ vars.SOROBAN_NETWORK_PASSPHRASE }}
          SOROBAN_CONTRACT_IDS: ${{ vars.SOROBAN_CONTRACT_IDS }}
          PROM_PUSHGATEWAY_URL: ${{ secrets.PROM_PUSHGATEWAY_URL }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
          # Bound network operations so a hung RPC or object-storage call fails
          # fast instead of stalling the job. Retries are capped and only apply
          # to transient failures; invalid credentials fail immediately.
          BACKUP_RPC_TIMEOUT_SECONDS: ${{ vars.BACKUP_RPC_TIMEOUT_SECONDS || '30' }}
          BACKUP_RPC_MAX_RETRIES: ${{ vars.BACKUP_RPC_MAX_RETRIES || '3' }}
          BACKUP_STORAGE_TIMEOUT_SECONDS: ${{ vars.BACKUP_STORAGE_TIMEOUT_SECONDS || '60' }}
          BACKUP_STORAGE_MAX_RETRIES: ${{ vars.BACKUP_STORAGE_MAX_RETRIES || '3' }}
          BACKUP_OUTPUT_DIR: backups
          # Preflight staging-space budget (issue #204). The script fails early
          # with a clear failure metric if less than this is free before the
          # database dump is created. Override via the BACKUP_REQUIRED_FREE_BYTES
          # repository variable.
          BACKUP_REQUIRED_FREE_BYTES: ${{ vars.BACKUP_REQUIRED_FREE_BYTES || '5368709120' }}
          # Unique run identifier (issue #203). Combined with an execution lock
          # inside the script, concurrent or retried runs cannot overwrite each
          # other's archive, manifest or metrics staging files.
          BACKUP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GIT_COMMIT: ${{ github.sha }}
          ENVIRONMENT: production
        run: bash scripts/backup.sh

      - name: Report upload and retention outcomes separately
        if: always() && steps.config.outputs.ready == 'true'
        env:
          BACKUP_OUTPUT_DIR: backups
        run: |
          set -euo pipefail
          status_file="$(ls -1t backups/*.json 2>/dev/null | head -n1 || true)"
          upload_status="unknown"
          retention_status="unknown"
          if [[ -n "${status_file}" ]]; then
            upload_status="$(jq -r '.upload_status // "unknown"' "${status_file}")"
            retention_status="$(jq -r '.retention_status // "unknown"' "${status_file}")"
          fi
          echo "upload_status=${upload_status}" >> "$GITHUB_OUTPUT"
          echo "retention_status=${retention_status}" >> "$GITHUB_OUTPUT"
          {
            echo "### Backup outcomes"
            echo "- **Upload**: \`${upload_status}\`"
            echo "- **Retention cleanup**: \`${retention_status}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${upload_status}" != "success" ]]; then
            echo "::error::Backup upload did not succeed (${upload_status}); no recoverable backup exists."
            exit 1
          fi
          if [[ "${retention_status}" != "success" ]]; then
            echo "::warning::Retention cleanup failed (${retention_status}); a recoverable backup exists but old archives may remain."
          fi

      - name: Upload backup manifest and metrics
        if: always() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Include the run attempt so retried runs get a distinct artifact
          # name instead of colliding with the previous attempt (issue #203).
          name: backup-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          # The script stages outputs under a per-run subdirectory keyed by
          # BACKUP_RUN_ID; glob recursively so the unique run path is matched.
          path: |
            backups/**/*.json
            backups/**/*.prom
          if-no-files-found: warn
          retention-days: 30

  verify-restore:
    name: Verify Restore (Staging)
    # With job=both, run after the backup so it verifies the fresh archive.
    # always() keeps this job from being skipped when `backup` was skipped.
    needs: [backup]
    if: >-
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') ||
        (github.event_name == 'workflow_dispatch' && inputs.job != 'backup')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install restore clients
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_CLIENT_VERSION}" awscli gnupg
          echo "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Validate restore configuration
        id: config
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_KEY"
          test -n "$BACKUP_STORAGE_BUCKET"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Restore plan (no database writes)
        if: steps.config.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_AGE_RECIPIENTS_FILE: ${{ vars.BACKUP_AGE_RECIPIENTS_FILE }}
          BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_REGION: ${{ secrets.BACKUP_STORAGE_REGION || 'us-east-1' }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
          BACKUP_STORAGE_ENDPOINT: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
          BACKUP_STORAGE_TIMEOUT_SECONDS: ${{ vars.BACKUP_STORAGE_TIMEOUT_SECONDS || '60' }}
          BACKUP_STORAGE_MAX_RETRIES: ${{ vars.BACKUP_STORAGE_MAX_RETRIES || '3' }}
        run: bash scripts/restore.sh --plan

      - name: Run restore verification
        if: steps.config.outputs.ready == 'true'
        env:
          # The staging role needs CREATEDB (verification restores into a
          # throwaway database that is dropped afterwards) plus the schema and
          # table privileges required to load the dump. restore.sh runs a
          # connectivity/permission preflight before decrypting the archive, so
          # an unreachable or under-privileged target fails fast without
          # leaving decrypted staging artifacts behind.
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_AGE_RECIPIENTS_FILE: ${{ vars.BACKUP_AGE_RECIPIENTS_FILE }}
          BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_REGION: ${{ secrets.BACKUP_STORAGE_REGION || 'us-east-1' }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
          BACKUP_STORAGE_ENDPOINT: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
          # Same bounded network policy as the backup job so verification
          # exercises the deadline/retry behavior against object storage.
          BACKUP_STORAGE_TIMEOUT_SECONDS: ${{ vars.BACKUP_STORAGE_TIMEOUT_SECONDS || '60' }}
          BACKUP_STORAGE_MAX_RETRIES: ${{ vars.BACKUP_STORAGE_MAX_RETRIES || '3' }}
          # Critical tables with expected row counts/bounds recorded from the
          # backup, e.g. "accounts=1000-2000,transactions>=5000". Missing or
          # out-of-bounds tables fail verification even when the table exists.
          RESTORE_CRITICAL_TABLES: ${{ vars.RESTORE_CRITICAL_TABLES }}
          # Extensions the target must provide before destructive SQL runs.
          RESTORE_REQUIRED_EXTENSIONS: ${{ vars.RESTORE_REQUIRED_EXTENSIONS || 'pgcrypto' }}
          # Bounded lock/statement policy so a conflicting session cannot leave
          # an unattended restore waiting indefinitely.
          RESTORE_LOCK_TIMEOUT: ${{ vars.RESTORE_LOCK_TIMEOUT || '30s' }}
          RESTORE_STATEMENT_TIMEOUT: ${{ vars.RESTORE_STATEMENT_TIMEOUT || '15min' }}
          # Sanitized audit report (no connection passwords) uploaded below.
          RESTORE_AUDIT_REPORT: restore-audit/restore-audit.json
        run: bash scripts/restore.sh --verify-only

      - name: Upload restore audit report
        if: always() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: restore-audit-${{ github.run_id }}
          path: |
            restore-audit/*.json
            restore-audit/*.txt
          if-no-files-found: warn
          retention-days: 30

  backup-outcome-selftest:
    name: Backup Outcome Reporting Self-Test
    # Simulates a successful upload followed by a failed retention cleanup and
    # asserts both outcomes are reported independently.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate upload success with retention failure
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "${workdir}/backups"
          cat > "${workdir}/backups/backup-test.json" <<'JSON'
          {"upload_status":"success","retention_status":"failure"}
          JSON
          status_file="$(ls -1t "${workdir}"/backups/*.json | head -n1)"
          upload_status="$(jq -r '.upload_status' "${status_file}")"
          retention_status="$(jq -r '.retention_status' "${status_file}")"
          test "${upload_status}" = "success"
          test "${retention_status}" = "failure"
          {
            echo "### Backup outcome self-test"
            echo "- **Upload**: \`${upload_status}\`"
            echo "- **Retention cleanup**: \`${retention_status}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Notify on Backup or Restore Failure
    needs: [backup, verify-restore]
    if: >-
      always() && (
        needs.backup.result == 'failure' ||
        needs.verify-restore.result == 'failure'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          UPLOAD_STATUS: ${{ needs.backup.outputs.upload_status }}
          RETENTION_STATUS: ${{ needs.backup.outputs.retention_status }}
          VERIFY_RESULT: ${{ needs.verify-restore.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          msg="SynapsVault Database Backup workflow failed (backup=${BACKUP_RESULT}, upload=${UPLOAD_STATUS}, retention=${RETENTION_STATUS}, verify-restore=${VERIFY_RESULT}): ${RUN_URL}"
          echo "::error::${msg}"
          if [[ -n "${ALERT_WEBHOOK_URL}" ]]; then
            payload="$(printf '{"text":"%s"}' "${msg}")"
            curl -fsS -X POST -H 'Content-Type: application/json' --data "${payload}" "${ALERT_WEBHOOK_URL}"
          else
            echo "::warning::ALERT_WEBHOOK_URL secret is not set; failure logged to workflow summary only."
          fi
          {
            echo "### :x: Backup / Restore Verification Failure"
            echo "- **Backup job**: \`${BACKUP_RESULT}\`"
            echo "- **Upload status**: \`${UPLOAD_STATUS:-unknown}\`"
            echo "- **Retention status**: \`${RETENTION_STATUS:-unknown}\`"
            echo "- **Verify-restore job**: \`${VERIFY_RESULT}\`"
            echo "- **Run URL**: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
