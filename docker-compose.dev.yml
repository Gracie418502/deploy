# Development override for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Bind-mounts application sources and runs the dev servers with hot reload
# instead of the production build/start commands.
#
# Monitoring retention:
#   The monitoring stack (Prometheus, Grafana, etc.) is defined in the base
#   docker-compose.yml. This dev override intentionally does NOT redefine any
#   monitoring services, so local runs inherit the base retention flags and
#   volume budgets unchanged (e.g. Prometheus `--storage.tsdb.retention.time`
#   and `--storage.tsdb.retention.size`, and the bounded named volumes). This
#   keeps dev and production retention behavior identical. If you need shorter
#   retention locally, add an explicit override in a separate compose file
#   rather than editing this one, so the base budgets remain the source of
#   truth.

services:
  backend:
    build:
      target: build
    command: npm run dev
    volumes:
      - ${BACKEND_SRC:-../backend}:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  frontend:
    build:
      target: build
    command: npm run dev -- --host 0.0.0.0 --port 8080
    volumes:
      - ${FRONTEND_SRC:-../frontend}:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    # NOTE: The production compose file defines a healthcheck that targets
    # `/healthz`, which is served by the nginx configuration in the production
    # image. The Vite dev server used here does not serve `/healthz`, so no
    # healthcheck is defined in this dev override. Do not add a `/healthz`
    # probe here without also adding a matching route to the dev server.