apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Optional: set imagePullSecrets in kustomization.yaml (patches) to pull
      # from a private registry. Omit for public registries.
      imagePullSecrets:
        - name: registry-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: taskapp-backend:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              # Scratch space for writable emptyDir volumes (see volumes below).
              # Startup only needs a few MiB; 64Mi request leaves headroom.
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              # Caps total ephemeral storage (emptyDir + container writable layer).
              # Must be >= sum of emptyDir sizeLimits below (256Mi + 64Mi).
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/backend
      volumes:
        # Writable scratch volumes are bounded so a runaway process cannot
        # exhaust node disk. Adjust sizeLimit if the app needs more scratch.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
